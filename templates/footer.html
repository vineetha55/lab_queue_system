
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microlab Footer</title>

    <style>
        /* Full page layout */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main content automatically occupies available space */
        .main-content {
            flex: 1;
        }

        /* Footer */
        .footer-custom {
            width: 100%;
            min-height: 55px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 25px;
            box-sizing: border-box;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-separator {
            color: #cbd5e1;
        }

        .footer-copy {
            font-size: 13px;
            color: #64748b;
        }

        .footer-copy a {
            color: #1677b8;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-link {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link:hover {
            color: #1677b8;
        }

        @media (max-width: 576px) {
            .footer-custom {
                justify-content: center;
                text-align: center;
                flex-direction: column;
                padding: 12px;
            }

            .footer-left {
                justify-content: center;
            }

            .footer-links {
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Your page content goes here -->
    </div>

    <!-- Footer -->
    <footer class="footer-custom">

        <div class="footer-left">
            <span class="footer-separator">|</span>

            <span class="footer-copy">
                &copy; 2026 Developed by
                <a href="#">Aslam</a>
            </span>
        </div>

        <div class="footer-right">
            <ul class="footer-links">
                <li>
                    <a href="/admin_home/" class="footer-link">
                        Overview
                    </a>
                </li>

                <li>
                    <a href="/br_waiting_lists" class="footer-link">
                        Statistics
                    </a>
                </li>
            </ul>
        </div>

    </footer>

    <!-- Scripts -->
    <script src="{% static 'assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/libs/apexcharts/apexcharts.min.js' %}"></script>
    <script src="{% static 'assets/libs/flatpickr/flatpickr.min.js' %}"></script>
    <script src="{% static 'assets/js/dashboard.js' %}"></script>

</body>
</html>
