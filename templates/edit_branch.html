
{% load static %}
{% include 'head.html' %}
<body>


 {% include 'sidebar.html' %}
<div class="main-wrapper">

{% include 'header.html' %}


    <!-- START: Page Header Banner -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Branch Updation</h1>
      </div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="/admin_home" class="text-decoration-none text-muted-green">Home</a></li>
          <li class="breadcrumb-item text-muted-green">Components</li>
          <li class="breadcrumb-item active text-main" aria-current="page">edit branch</li>
        </ol>
      </nav>
    </div>
    <!-- END: Page Header Banner -->

    <!-- START: Form Component Row Grid Layout -->
<div class="row g-4 mb-4">
    <div class="col-12 col-lg-8 mx-auto">
        <div class="card border-light shadow-sm p-4 h-100">

            <h5 class="card-title mb-4">Branch Updation</h5>

            <form method="POST" >
                {% csrf_token %}

                <div class="row g-3">

                    <!-- Branch Name -->
                    <div class="col-12 col-md-6">
                        <label for="branchName" class="form-label-custom">
                            Branch Name
                        </label>
                        <input type="text"
                               class="form-control-custom"
                               id="branchName"
                               name="name"
                               placeholder="Enter branch name"
                               maxlength="150"
                               value="{{branch.name}}"
                               required>
                    </div>

                    <!-- Email -->
                    <div class="col-12 col-md-6">
                        <label for="branchEmail" class="form-label-custom">
                            Email Address
                        </label>
                        <input type="email"
                               class="form-control-custom"
                               id="branchEmail"
                               name="email"
                               placeholder="branch@example.com"
                               value="{{branch.email}}"
                               maxlength="150">
                    </div>

                    <!-- Phone -->
                    <div class="col-12 col-md-6">
                        <label for="branchPhone" class="form-label-custom">
                            Phone Number
                        </label>
                        <input type="tel"
                               class="form-control-custom"
                               id="branchPhone"
                               name="phone"
                               placeholder="Enter phone number"
                               value="{{branch.phone}}"
                               maxlength="150">
                    </div>

                    <!-- Username -->
                    <div class="col-12 col-md-6">
                        <label for="branchUsername" class="form-label-custom">
                            Username
                        </label>
                        <input type="text"
                               class="form-control-custom"
                               id="branchUsername"
                               name="username"
                               placeholder="Create username"
                               maxlength="150"
                               value="{{branch.username}}"
                               required>
                    </div>

                    <!-- Password -->
                    <div class="col-12 col-md-6">
                        <label for="branchPassword" class="form-label-custom">
                            Password
                        </label>
                        <input type="text"
                               class="form-control-custom"
                               id="branchPassword"
                               name="password"
                               placeholder="Create password"
                               maxlength="150"
                               value="{{branch.password}}"
                               required>
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <label for="branchAddress" class="form-label-custom">
                            Branch Address
                        </label>
                        <textarea class="form-control-custom"
                                  id="branchAddress"
                                  name="address"
                                  rows="3"
                                  placeholder="Enter complete branch address"
                                  maxlength="150">{{branch.address}}</textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-light">
                            Reset
                        </button>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-building-add me-1"></i>
                            Update Branch
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </div>
</div>
    <!-- END: Form Component Row Grid Layout -->



{% include 'footer.html' %}
