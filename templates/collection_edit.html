

{% include 'navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .main-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .page-title {
            color: #173b59;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
        }

        .form-control {
            padding: 11px;
        }

        .patient-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container main-container">

    <div class="form-card">

        <h3 class="page-title mb-2">Edit Collection</h3>

        <p class="text-muted mb-4">
            Update patient collection information.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">Patient Name *</label>

                <input type="text"
                       name="patient_name"
                       class="form-control"
                       value="{{ collection.patient_name }}"
                       required>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Lab Number *</label>

                    <input type="text"
                           name="lab_number"
                           class="form-control"
                           value="{{ collection.lab_number }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Phone Number</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ collection.phone }}">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Purpose *</label>

                <input type="text"
                       name="purpose"
                       class="form-control"
                       value="{{ collection.purpose }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">Priority</label>

                <div class="form-check">

                    <input type="checkbox"
                           name="urgent"
                           class="form-check-input"
                           id="urgent"
                           {% if collection.urgent %}checked{% endif %}>

                    <label class="form-check-label text-danger fw-bold"
                           for="urgent">
                        Mark as Urgent
                    </label>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Additional Notes</label>

                <textarea name="note"
                          class="form-control"
                          rows="4">{{ collection.note }}</textarea>

            </div>

            <!-- <div class="mb-4">

                <label class="form-label">Patient Image</label>

                <div>
                    {% if collection.image %}
                        <img src="{{ collection.image.url }}"
                             class="patient-image d-block">
                    {% endif %}
                </div>

                <input type="file"
                       name="image"
                       class="form-control"
                       accept="image/*">

                <small class="text-muted">
                    Leave empty to retain the existing image.
                </small>

            </div> -->

            <hr>

            <div class="d-flex gap-2 flex-wrap">

                <button type="submit" class="btn btn-primary px-4">
                    Update Collection
                </button>

                <a href="{% url 'collection_detail' collection.id %}"
                   class="btn btn-outline-secondary px-4">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
