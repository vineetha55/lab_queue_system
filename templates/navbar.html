
{% load static %}

<style>
/* =========================================
   NAVBAR DESIGN SYSTEM
========================================= */
:root {
    --nav-primary: #1769e0;
    --nav-primary-dark: #1254bd;
    --nav-text: #172033;
    --nav-muted: #64748b;
    --nav-border: #e8edf5;
    --nav-danger: #dc3545;
    --nav-bg: #ffffff;

    --nav-height: 88px;
    --nav-mobile-height: 70px;
}

/* =========================================
   FIXED NAVBAR
========================================= */
.navbar-custom {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1200;
    width: 100%;
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
    box-shadow: 0 3px 16px rgba(15, 23, 42, .045);
}

.navbar-inner {
    width: 100%;
    max-width: 1400px;
    min-height: var(--nav-height);
    margin: 0 auto;
    padding: 8px 28px;

    display: flex;
    align-items: center;
    gap: 25px;

    box-sizing: border-box;
}

/* =========================================
   PAGE SPACING
========================================= */
body {
    padding-top: var(--nav-height);
}

/* =========================================
   LOGO
========================================= */
.navbar-custom .brand {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    text-decoration: none;
    background: transparent !important;
    box-shadow: none !important;
}

.navbar-custom .brand-icon {
    width: 125px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: visible;
    background: transparent !important;
    box-shadow: none !important;
}

.navbar-custom .brand-icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: transparent;
}

/* =========================================
   DESKTOP NAVIGATION
========================================= */
.navbar-custom .nav-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 9px;
    margin-left: auto;
}

.navbar-custom .nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    min-height: 44px;
    padding: 11px 16px;

    border-radius: 11px;
    border: 1px solid transparent;

    font-size: 13px;
    font-weight: 700;
    color: var(--nav-text);

    text-decoration: none !important;
    white-space: nowrap;

    transition: all .22s ease;
    box-sizing: border-box;
}

.navbar-custom .nav-btn i {
    font-size: 17px;
}

.navbar-custom .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 12px 14px;

    border-radius: 10px;
    color: #475569;

    font-size: 13px;
    font-weight: 700;

    text-decoration: none;
    white-space: nowrap;

    transition: all .2s ease;
}

.navbar-custom .nav-link:hover {
    color: var(--nav-primary);
    background: #eff6ff;
}

/* STAFF PORTAL */
.navbar-custom .staff-btn {
    color: var(--nav-primary);
    background: #eff6ff;
    border-color: #dbeafe;
}

.navbar-custom .staff-btn:hover {
    background: #dbeafe;
    color: var(--nav-primary-dark);
}

/* TV DISPLAY */
.navbar-custom .tv-btn {
    color: #475569;
    background: #f8fafc;
    border-color: #e2e8f0;
}

.navbar-custom .tv-btn:hover {
    color: var(--nav-primary);
    background: #eff6ff;
}

/* WAITING LIST */
.navbar-custom .waiting-btn {
    background: var(--nav-primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(23, 105, 224, .18);
}

.navbar-custom .waiting-btn:hover {
    background: var(--nav-primary-dark);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(23, 105, 224, .22);
}

/* LOGOUT */
.navbar-custom .logout-btn {
    color: var(--nav-danger);
    background: #fff7f7;
    border-color: #f8d7da;
}

.navbar-custom .logout-btn:hover {
    color: #b42335;
    background: #ffe8eb;
}

/* =========================================
   MOBILE TOGGLE
========================================= */
.navbar-custom .mobile-nav-toggle {
    display: none;

    align-items: center;
    justify-content: center;

    width: 46px;
    height: 46px;
    flex-shrink: 0;

    border: 1px solid var(--nav-border);
    border-radius: 12px;

    background: #f8fafc;
    color: var(--nav-text);

    font-size: 23px;
    cursor: pointer;

    margin-left: auto;
    position: relative;
    z-index: 1203;

    transition: all .2s ease;
}

.navbar-custom .mobile-nav-toggle:hover {
    background: #eff6ff;
    color: var(--nav-primary);
}

/* =========================================
   TABLET
========================================= */
@media (max-width: 1050px) and (min-width: 768px) {

    .navbar-inner {
        padding-inline: 16px;
        gap: 12px;
    }

    .navbar-custom .brand-icon {
        width: 90px;
        height: 65px;
    }

    .navbar-custom .nav-actions {
        gap: 4px;
    }

    .navbar-custom .nav-btn,
    .navbar-custom .nav-link {
        padding: 10px 9px;
        font-size: 12px;
        gap: 6px;
    }
}

/* =========================================
   MOBILE NAVIGATION
========================================= */
@media (max-width: 767.98px) {

    body {
        padding-top: var(--nav-mobile-height);
    }

    .navbar-inner {
        min-height: var(--nav-mobile-height);
        padding: 6px 17px;
        gap: 10px;
    }

    .navbar-custom .brand {
        flex: 0 1 auto;
        min-width: 0;
        max-width: calc(100% - 58px);
    }

    .navbar-custom .brand-icon {
        width: auto;
        height: auto;

        max-width: 100%;
        max-height: 57px;

        display: flex;
        align-items: center;
        justify-content: flex-start;

        overflow: visible;
    }

    .navbar-custom .brand-icon img {
        width: auto !important;
        height: auto !important;

        max-width: 100%;
        max-height: 55px;

        object-fit: contain;
    }

    /* TOGGLE ON RIGHT */
    .navbar-custom .mobile-nav-toggle {
        display: inline-flex;
        margin-left: auto;
    }

    /* FULL SCREEN MENU */
    .navbar-custom .nav-actions {
        position: fixed;
        inset: 0;

        z-index: 1201;

        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;

        width: 100%;
        height: 100vh;
        height: 100dvh;

        box-sizing: border-box;

        margin: 0;
        padding: 110px 22px 30px;
        gap: 13px;

        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;

        background: #ffffff;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transform: translateY(-10px);

        transition:
            opacity .25s ease,
            transform .25s ease,
            visibility .25s ease;
    }

    .navbar-custom .nav-actions.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .navbar-custom .nav-actions::before {
        content: "NAVIGATION MENU";

        color: #64748b;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2.5px;

        margin-bottom: 7px;
    }

    .navbar-custom .nav-btn,
    .navbar-custom .nav-link {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 15px;

        width: 100%;
        min-height: 65px;
        flex-shrink: 0;

        box-sizing: border-box;
        padding: 12px 16px;

        border-radius: 15px;

        font-size: 15px;
        font-weight: 700;

        box-shadow: 0 5px 18px rgba(15, 23, 42, .045);
    }

    .navbar-custom .nav-btn i,
    .navbar-custom .nav-link i {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 42px;
        height: 42px;
        flex-shrink: 0;

        border-radius: 12px;
        font-size: 20px;

        background: rgba(255, 255, 255, .2);
    }

    .navbar-custom .nav-link {
        color: #334155;
        background: #fff;
        border: 1px solid #e5eaf2;
    }

    .navbar-custom .nav-link i {
        color: var(--nav-primary);
        background: #eff6ff;
    }

    .navbar-custom .staff-btn {
        background: #eff6ff;
    }

    .navbar-custom .staff-btn i {
        background: #dbeafe;
    }

    .navbar-custom .waiting-btn {
        background: linear-gradient(135deg, #1769e0, #1254bd);
        color: white;
    }

    .navbar-custom .waiting-btn i {
        color: var(--nav-primary);
        background: white;
    }

    .navbar-custom .tv-btn {
        background: #fff;
    }

    .navbar-custom .tv-btn i {
        background: #eff6ff;
        color: var(--nav-primary);
    }

    .navbar-custom .logout-btn {
        background: #fff;
    }

    .navbar-custom .logout-btn i {
        color: var(--nav-danger);
        background: #fff0f2;
    }

    .navbar-custom .nav-btn:active,
    .navbar-custom .nav-link:active {
        transform: scale(.985);
    }
}

/* =========================================
   SMALL MOBILE
========================================= */
@media (max-width: 420px) {

    .navbar-inner {
        padding-inline: 12px;
        gap: 8px;
    }

    .navbar-custom .brand {
        max-width: calc(100% - 54px);
    }

    .navbar-custom .brand-icon {
        max-height: 52px;
    }

    .navbar-custom .brand-icon img {
        max-height: 50px;
    }

    .navbar-custom .mobile-nav-toggle {
        width: 42px;
        height: 42px;
        font-size: 21px;
    }

    .navbar-custom .nav-actions {
        padding: 95px 17px 24px;
    }

    .navbar-custom .nav-btn,
    .navbar-custom .nav-link {
        min-height: 61px;
        font-size: 14px;
    }
}

/* =========================================
   VERY SMALL MOBILE
========================================= */
@media (max-width: 340px) {

    .navbar-inner {
        padding-inline: 9px;
    }

    .navbar-custom .brand-icon img {
        max-height: 45px;
    }

    .navbar-custom .mobile-nav-toggle {
        width: 40px;
        height: 40px;
    }
}

/* =========================================
   ACCESSIBILITY
========================================= */
.navbar-custom a:focus-visible,
.navbar-custom button:focus-visible {
    outline: 2px solid var(--nav-primary);
    outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {

    .navbar-custom *,
    .navbar-custom *::before,
    .navbar-custom *::after {
        transition: none !important;
    }
}

/* =========================================
   SWEETALERT2 DESIGN
========================================= */
.microlab-swal-popup {
    border-radius: 20px !important;
    padding: 30px 25px !important;
    font-family: inherit !important;
}

.microlab-swal-title {
    color: #172033 !important;
    font-size: 23px !important;
    font-weight: 800 !important;
}

.microlab-swal-html {
    color: #64748b !important;
    font-size: 14px !important;
}

.microlab-swal-confirm,
.microlab-swal-cancel {
    border-radius: 10px !important;
    padding: 11px 23px !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    min-width: 105px;
}

.swal2-icon.swal2-warning {
    border-color: #f0ad4e !important;
    color: #f0ad4e !important;
}
</style>


<!-- =========================================
     NAVBAR HTML
========================================= -->
<nav class="navbar-custom" aria-label="Main navigation">

    <div class="navbar-inner">

        <!-- BRAND LOGO -->
        <a href="{% url 'home' %}"
           class="brand"
           aria-label="Lab Bill Scanner Home">

            <span class="brand-icon">

                <img
                    src="https://microlabchengannur.com/static/logo.png"

            class="btn btn-primary">
             <i class="bi bi-list-ul"></i> Tests
         </a>
                <!-- LOGOUT -->
                <a href="/logout_view"
                   class="nav-btn logout-btn"
                   id="logoutNavLink">

                    <i class="bi bi-box-arrow-right"
                       aria-hidden="true"></i>

                    <span>Logout</span>

            {% endif %}

        </div>

    </div>

</nav>


<!-- =========================================
     SWEETALERT2 LIBRARY
========================================= -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- =========================================
     MOBILE NAVIGATION JAVASCRIPT
========================================= -->
<script>
(function () {

    'use strict';

    const toggle = document.getElementById('mobileNavToggle');
    const menu = document.getElementById('navActions');
    const icon = document.getElementById('mobileNavIcon');
    const logoutLink = document.getElementById('logoutNavLink');

    if (!toggle || !menu || !icon) return;

    let previousBodyOverflow = '';

    const mobileQuery = window.matchMedia('(max-width: 767.98px)');


    /* CHECK MOBILE SCREEN */
    function isMobile() {
        return mobileQuery.matches;
    }


    /* OPEN / CLOSE MENU */
    function setMenu(open) {

        const shouldOpen = Boolean(open) && isMobile();

        if (shouldOpen && !menu.classList.contains('show')) {
            previousBodyOverflow = document.body.style.overflow;
        }

        menu.classList.toggle('show', shouldOpen);

        toggle.setAttribute(
            'aria-expanded',
            String(shouldOpen)
        );

        toggle.setAttribute(
            'aria-label',
            shouldOpen
                ? 'Close navigation menu'
                : 'Open navigation menu'
        );

        icon.classList.toggle('bi-list', !shouldOpen);
        icon.classList.toggle('bi-x-lg', shouldOpen);

        document.body.style.overflow = shouldOpen
            ? 'hidden'
            : previousBodyOverflow;

    }


    /* MOBILE TOGGLE */
    toggle.addEventListener('click', function () {

        setMenu(!menu.classList.contains('show'));

    });


    /* CLOSE WHEN CLICKING OUTSIDE */
    document.addEventListener('click', function (event) {

        if (
            menu.classList.contains('show') &&
            !menu.contains(event.target) &&
            !toggle.contains(event.target)
        ) {

            setMenu(false);

        }

    });


    /* CLOSE WITH ESCAPE */
    document.addEventListener('keydown', function (event) {

        if (
            event.key === 'Escape' &&
            menu.classList.contains('show')
        ) {

            setMenu(false);
            toggle.focus();

        }

    });


    /* NAVIGATION LINKS AND LOGOUT CONFIRMATION */
    menu.querySelectorAll('a').forEach(function (link) {

        link.addEventListener('click', function (event) {

            /* LOGOUT CONFIRMATION */
            if (link === logoutLink) {

                event.preventDefault();

                setMenu(false);

                Swal.fire({

                    title: 'Are you sure?',

                    text: 'Do you really want to logout from your account?',

                    icon: 'warning',

                    showCancelButton: true,

                    confirmButtonText: 'Yes, Logout',

                    cancelButtonText: 'Cancel',

                    confirmButtonColor: '#dc3545',

                    cancelButtonColor: '#64748b',

                    reverseButtons: true,

                    buttonsStyling: true,

                    allowOutsideClick: false,

                    allowEscapeKey: true,

                    customClass: {

                        popup: 'microlab-swal-popup',

                        title: 'microlab-swal-title',

                        htmlContainer: 'microlab-swal-html',

                        confirmButton: 'microlab-swal-confirm',

                        cancelButton: 'microlab-swal-cancel'

                    }

                }).then(function (result) {

                    if (result.isConfirmed) {

                        window.location.href = link.href;

                    }

                });

                return;

            }

            /* CLOSE MENU AFTER NORMAL NAVIGATION */
            setMenu(false);

        });

    });


    /* RESET WHEN RESIZING */
    function handleViewportChange() {

        if (!isMobile()) {

            setMenu(false);

        }

    }


    window.addEventListener('resize', handleViewportChange);

    if (mobileQuery.addEventListener) {

        mobileQuery.addEventListener(
            'change',
            handleViewportChange
        );

    } else {

        mobileQuery.addListener(handleViewportChange);

    }

})();
</script>
