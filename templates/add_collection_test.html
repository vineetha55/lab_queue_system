
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Collection Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width:500px;">

        <div class="card-body p-4">

            <h4 class="mb-3">Add Patient Test</h4>

            <div class="mb-3">
                <strong>Patient:</strong> {{ bill.patient_name }}<br>
                <strong>Bill Number:</strong> {{ bill.lab_number }}
            </div>

            <form method="POST">
                {% csrf_token %}

                <label class="form-label">Select Test</label>

                <select name="test_name" class="form-select" required>
                    <option value="">Choose Test</option>
                    <option value="Sugar">Sugar</option>
                    <option value="PPBS">PPBS</option>
                    <option value="LFT">LFT</option>
                    <option value="X-Ray">X-Ray</option>
                    <option value="ECG">ECG</option>
                    <option value="Scan">Scan</option>
                    <option value="Urine">Urine</option>
                    <option value="CBC">CBC</option>
                    <option value="Other">Other</option>
                </select>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        Add Test
                    </button>

                    <a href="{% url 'collection_dashboard' %}"
                       class="btn btn-secondary">
                        Back
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
